<!doctype html>
<html>
<head><meta charset="utf-8"><title>dream pass bench</title></head>
<body style="margin:0;background:#111;color:#ddd;font:12px monospace">
<pre id="out">running…</pre>
<script type="module">
/* Dream Rooms plan · post-processing cost on this PC (throwaway; out of the app).
   Served by `npx vite`, driven by bench.mjs. Renders the Blender-baked corridor at phone pixel counts with:
     raw     – the baked GLB, FogExp2, no post
     dream   – RenderPass + the ONE merged dream pass (dreamPass.js)
     stock   – RenderPass + UnrealBloomPass + BokehPass + FilmPass + OutputPass (three's own stack)
   Each config renders N frames back to back and syncs with readPixels, so the number is GPU time per frame. */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { DreamShader } from '/src/components/portal/modules/dream-rooms-plan/dreamPass.js';

const SIZES = { 'iPhone DPR 3 (1170x2532)': [1170, 2532], 'iPhone capped 1.5 (585x1266)': [585, 1266], 'desktop 1440x900': [1440, 900] };
const N = 150;
const gltf = await new GLTFLoader().loadAsync('/src/components/portal/modules/dream-rooms-plan/corridor.glb');
const canvas = document.createElement('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const gl = renderer.getContext();
const scene = new THREE.Scene();
scene.background = new THREE.Color('#8f8862');
scene.fog = new THREE.FogExp2('#8f8862', 0.085);
for (const k of [-1, 0, 1, 2, 3]) { const r = gltf.scene.clone(true); r.position.z = -k * 8; scene.add(r); }
const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 60);
camera.position.set(0.22, 1.5, -1);

function build(kind, w, h) {
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (kind === 'raw') return { render: () => renderer.render(scene, camera), passes: 1, dispose() {} };
  const c = new EffectComposer(renderer);
  c.setSize(w, h);
  c.addPass(new RenderPass(scene, camera));
  let passes = 1;
  if (kind === 'dream') {
    const p = new ShaderPass(DreamShader); p.uniforms.uRes.value = [w, h]; c.addPass(p); passes += 1;
  } else {
    c.addPass(new UnrealBloomPass(new THREE.Vector2(w, h), 0.6, 0.6, 0.8)); passes += 11; // highpass + 5 mips x 2 blurs + composite ≈ 12 draws
    c.addPass(new BokehPass(scene, camera, { focus: 4, aperture: 0.002, maxblur: 0.008 })); passes += 2; // depth render + bokeh
    c.addPass(new FilmPass(0.35)); passes += 1;
    c.addPass(new OutputPass()); passes += 1;
  }
  return { render: () => c.render(1 / 60), passes, dispose: () => c.dispose() };
}

const px = new Uint8Array(4);
const results = [];
for (const [label, [w, h]] of Object.entries(SIZES)) {
  for (const kind of ['raw', 'dream', 'stock']) {
    const b = build(kind, w, h);
    for (let i = 0; i < 10; i++) b.render();
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const t0 = performance.now();
    for (let i = 0; i < N; i++) { camera.position.z = -1 - (i % 80) * 0.1; b.render(); }
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const ms = (performance.now() - t0) / N;
    results.push({ size: label, kind, msPerFrame: +ms.toFixed(3), fullScreenDraws: b.passes, drawCalls: renderer.info.render.calls });
    b.dispose();
  }
}
const info = gl.getExtension('WEBGL_debug_renderer_info');
const gpu = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : 'unknown';
window.__bench = { gpu, results };
document.getElementById('out').textContent = JSON.stringify(window.__bench, null, 2);
</script>
</body>
</html>
