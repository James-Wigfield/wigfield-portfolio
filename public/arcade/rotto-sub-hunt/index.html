<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rotto Sub Hunt — Wigfield Arcade</title>
  <meta name="description" content="Battleship in the water off Rottnest. Hide your fleet, take turns firing, and mind the quokkas. A two-phone versus game." />
  <meta name="theme-color" content="#05070f" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/arcade/shared/arcade.css" />
  <style>
    :root {
      --sh-sea: #2fb3d6;
      --sh-deep: #0b3a5c;
      --sh-hit: #ff7a3d;
      --sh-gold: #ffd166;
    }

    /* ── Frame ─────────────────────────────────────────────────────────────── */
    #game[hidden] { display: none; }
    .sh {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 var(--ar-gutter) calc(40px + env(safe-area-inset-bottom));
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    .sh-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 0 10px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ar-faint);
    }
    .sh-spacer { flex: 1; }
    .sh-head .ar-back { white-space: nowrap; }
    .sh-tally {
      color: var(--ar-dim);
      white-space: nowrap;
      min-width: 0;
      flex: 0 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sh-code, .sh-icon { flex: none; }
    .sh-tally b { color: var(--ar-ink); font-weight: 600; }
    .sh-code, .sh-icon {
      font-family: var(--ar-display);
      font-size: 11px;
      color: var(--ar-amber);
      letter-spacing: 0.1em;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 6px 4px;
    }
    .sh-icon { color: var(--ar-dim); font-family: var(--ar-mono); font-size: 14px; }
    .sh-icon[data-off="1"] { text-decoration: line-through; opacity: 0.5; }

    /* ── Status ────────────────────────────────────────────────────────────── */
    .sh-status {
      background: var(--ar-panel);
      border: 1px solid var(--ar-line);
      border-radius: var(--ar-radius);
      padding: 12px 14px 0;
      overflow: hidden;
    }
    .sh-status__main {
      font-family: var(--ar-display);
      font-size: clamp(12px, 3.8vw, 15px);
      line-height: 1.5;
      color: var(--ar-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sh-status[data-tone="go"] .sh-status__main { color: var(--ar-amber); }
    .sh-status[data-tone="win"] .sh-status__main { color: var(--ar-green); }
    .sh-status[data-tone="lose"] .sh-status__main { color: var(--ar-red); }
    .sh-status__sub {
      color: var(--ar-dim);
      font-size: 12px;
      line-height: 1.6;
      margin: 4px 0 10px;
      min-height: 1.6em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #peek-back { color: var(--ar-amber); padding: 0 12px 0 0; margin: -12px 0; min-height: 44px; }
    .sh-timer { height: 3px; margin: 0 -14px; background: var(--ar-line-soft); }
    .sh-timer__fill { height: 100%; width: 0; background: var(--sh-sea); }
    .sh-status[data-tone="go"] .sh-timer__fill { background: var(--ar-amber); }
    .sh-timer__fill[data-low="1"] { background: var(--ar-red) !important; }

    /* ── Boards ────────────────────────────────────────────────────────────── */
    .sh-board { margin-top: 14px; }
    .sh-board__label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ar-faint);
      margin-bottom: 6px;
    }
    .sh-board__label b { color: var(--ar-dim); font-weight: 600; }

    .sh-grid {
      display: grid;
      grid-template-columns: 16px 1fr;
      grid-template-rows: 16px auto;
      gap: 3px;
    }
    .sh-cols, .sh-rows {
      display: grid;
      font-family: var(--ar-display);
      font-size: 8px;
      color: var(--ar-faint);
      text-align: center;
      align-items: center;
    }
    .sh-cols { grid-column: 2; grid-template-columns: repeat(8, 1fr); }
    .sh-rows { grid-row: 2; grid-template-rows: repeat(8, 1fr); }
    .sh-canvas {
      grid-column: 2;
      grid-row: 2;
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      image-rendering: pixelated;
      border: 1px solid #12324d;
      border-radius: 2px;
      background: var(--sh-deep);
      touch-action: manipulation;
      cursor: crosshair;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .sh-board--mini { max-width: 260px; }
    @media (max-width: 899px) {
      .sh-board--main { max-width: max(280px, calc(100dvh - 250px)); margin-left: auto; margin-right: auto; }
    }
    /* Short phones (SE in Safari, small Androids): Ready / Fire stay on screen */
    @media (max-width: 899px) and (max-height: 640px) {
      #pl, #act {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        padding: 10px var(--ar-gutter) calc(10px + env(safe-area-inset-bottom));
        background: rgba(5, 7, 15, 0.95);
        border-top: 1px solid var(--ar-line);
      }
      #pl .sh-hint { display: none; }
      .sh-board--main { max-width: max(230px, calc(100dvh - 300px)); }
      #pl .ar-btn, #act .ar-btn, #act .sh-mode { padding-top: 11px; padding-bottom: 11px; }
      .sh { padding-bottom: 190px; }
    }
    .sh-grid--mini { grid-template-columns: 12px 1fr; grid-template-rows: 12px auto; }
    .sh-grid--mini .sh-cols, .sh-grid--mini .sh-rows { font-size: 6px; }
    .sh-grid--mini .sh-canvas { cursor: default; }

    .sh-shake { animation: sh-shake 0.42s; }
    @keyframes sh-shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 2px); }
      40% { transform: translate(4px, -2px); }
      60% { transform: translate(-3px, -1px); }
      80% { transform: translate(2px, 1px); }
    }

    /* ── Controls ──────────────────────────────────────────────────────────── */
    .sh-controls { margin-top: 12px; }
    .sh-controls [hidden] { display: none !important; }
    .sh-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .sh-row > * { flex: 1; }
    .sh-hint { color: var(--ar-dim); font-size: 12px; line-height: 1.7; margin: 0 0 10px; }
    .sh-mode {
      appearance: none;
      padding: 12px 10px;
      font-family: var(--ar-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ar-dim);
      background: #070c17;
      border: 1px solid var(--ar-line);
      border-radius: var(--ar-radius);
      cursor: pointer;
      touch-action: manipulation;
    }
    .sh-mode b { color: var(--ar-ink); }
    .sh-mode[data-on="1"] { color: var(--ar-ink); border-color: var(--sh-sea); box-shadow: inset 0 0 0 1px var(--sh-sea); }
    .sh-mode:disabled { opacity: 0.35; cursor: not-allowed; }
    #act-fire[data-sonar="1"] { background: var(--sh-sea); border-color: var(--sh-sea); }
    #act-fire[data-wait="1"] { color: var(--ar-faint); background: transparent; border-color: var(--ar-line); opacity: 1; }

    /* ── Feed ──────────────────────────────────────────────────────────────── */
    .sh-feed {
      margin-top: 12px;
      border-top: 1px solid var(--ar-line-soft);
      padding-top: 10px;
      min-height: 64px;
    }
    .sh-feed p {
      margin: 0 0 4px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--ar-faint);
    }
    .sh-feed p:last-child { color: var(--ar-ink); }
    .sh-feed .t-hit { color: var(--sh-hit); }
    .sh-feed .t-q { color: var(--sh-gold); }
    .sh-feed .t-sonar { color: var(--sh-sea); }

    /* ── Lower deck: my waters + fleets ────────────────────────────────────── */
    .sh-lower {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr);
      gap: 14px;
      align-items: start;
    }
    .sh-fleets { margin-top: 14px; }
    .sh-fleets h3 {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ar-faint);
      font-weight: 400;
      margin: 0 0 6px;
    }
    .sh-fleets ul { list-style: none; padding: 0; margin: 0 0 14px; }
    .sh-fleets li {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--ar-dim);
      margin-bottom: 4px;
    }
    .sh-fleets li[data-sunk="1"] { color: var(--ar-faint); text-decoration: line-through; }
    .sh-pips { display: inline-flex; gap: 2px; flex: none; }
    .sh-pips i { width: 6px; height: 6px; background: var(--sh-sea); display: block; }
    .sh-fleets li[data-sunk="1"] .sh-pips i { background: var(--ar-red); opacity: 0.6; }

    .sh-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .sh-concede {
      appearance: none;
      background: none;
      border: 0;
      color: var(--ar-faint);
      font-family: var(--ar-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 8px 0;
    }
    .sh-concede[data-arm="1"] { color: var(--ar-red); }

    /* ── Desktop: boards side by side ──────────────────────────────────────── */
    @media (min-width: 900px) {
      .sh { max-width: 1000px; }
      .sh-main {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }
      .sh-lower { grid-template-columns: 1fr; }
      .sh-board--mini { max-width: 340px; }
      /* a 1280×800 laptop must still see the controls under the board */
      .sh-board--main { max-width: max(320px, calc(100dvh - 330px)); }
    }

    /* ── Overlay (lobby / game over / spectator) ───────────────────────────── */
    .sh-over {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(3, 6, 14, 0.86);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      overflow-y: auto;
      padding: calc(20px + env(safe-area-inset-top)) var(--ar-gutter) calc(30px + env(safe-area-inset-bottom));
    }
    .sh-over[hidden] { display: none; }
    .sh-over__inner {
      max-width: 440px;
      margin: 0 auto;
      background: var(--ar-panel);
      border: 1px solid var(--ar-line);
      border-radius: var(--ar-radius);
      padding: 0 0 20px;
      overflow: hidden;
    }
    .sh-over__inner > :not(.sh-art) { margin-left: 20px; margin-right: 20px; }
    .sh-art { display: block; width: 100%; aspect-ratio: 256 / 143; image-rendering: pixelated; border-bottom: 1px solid var(--ar-line); }
    .sh-over h2 {
      font-family: var(--ar-display);
      font-size: clamp(15px, 5vw, 20px);
      line-height: 1.5;
      margin: 20px 20px 10px;
    }
    .sh-over p { color: var(--ar-dim); font-size: 13px; line-height: 1.75; margin: 0 20px 12px; }
    .sh-over p b { color: var(--ar-ink); }
    .sh-over p.ar-code-display {
      color: var(--ar-amber);
      font-size: clamp(26px, 10vw, 38px);
      line-height: 1.3;
      text-align: center;
      margin: 4px 20px 14px;
    }
    .sh-over ul.sh-rules { color: var(--ar-dim); font-size: 12px; line-height: 1.7; padding-left: 18px; margin: 0 20px 14px; }
    .sh-over ul.sh-rules li { margin-bottom: 6px; }
    .sh-over .ar-btn { margin-top: 10px; display: flex; width: calc(100% - 40px); }
    .sh-over .ar-players { margin-bottom: 14px; }
    .sh-big { font-family: var(--ar-display); font-size: clamp(22px, 8vw, 32px) !important; text-align: center; margin: 22px 20px 6px !important; }
    .sh-big[data-tone="win"] { color: var(--ar-green); text-shadow: 0 0 24px rgba(110, 231, 165, 0.35); }
    .sh-big[data-tone="lose"] { color: var(--ar-red); text-shadow: 0 0 24px rgba(255, 107, 107, 0.3); }
    .sh-stats { width: calc(100% - 40px); border-collapse: collapse; font-size: 12px; margin: 6px 20px 14px; }
    .sh-stats th, .sh-stats td { padding: 7px 4px; border-bottom: 1px solid var(--ar-line-soft); text-align: right; }
    .sh-stats th:first-child, .sh-stats td:first-child { text-align: left; color: var(--ar-faint); }
    .sh-stats th { font-weight: 400; color: var(--ar-faint); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
    .sh-quokka-inline { width: 20px; height: 20px; image-rendering: pixelated; vertical-align: -5px; }
  </style>
</head>
<body>
  <div id="gate"></div>

  <div id="game" class="sh" hidden>
    <header class="sh-head">
      <a class="ar-back" href="/arcade/">← Arcade</a>
      <span class="sh-spacer"></span>
      <span class="sh-tally" id="h-tally"></span>
      <button class="sh-icon" id="h-mute" title="Sound on/off" aria-label="Toggle sound">♪</button>
      <button class="sh-code" id="h-code" title="Share this room">·····</button>
    </header>

    <div class="sh-status" id="status">
      <div class="sh-status__main" id="s-main">Waiting</div>
      <div class="sh-status__sub" id="s-sub"></div>
      <div class="sh-timer"><div class="sh-timer__fill" id="s-timer"></div></div>
    </div>

    <div class="sh-main">
      <div>
        <section class="sh-board sh-board--main" id="main-wrap">
          <div class="sh-board__label"><span id="main-label">Their waters</span><span id="main-meta"></span></div>
          <div class="sh-grid">
            <div class="sh-cols"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div>
            <div class="sh-rows"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span></div>
            <canvas class="sh-canvas" id="cv-main" data-board="main"></canvas>
          </div>
        </section>

        <section class="sh-controls">
          <div id="pl" hidden>
            <p class="sh-hint" id="pl-hint">Drag a boat, or tap it and then tap open water. Tap a picked-up boat again to turn it.</p>
            <div class="sh-row">
              <button class="ar-btn ar-btn--ghost" id="pl-rotate">Rotate</button>
              <button class="ar-btn ar-btn--ghost" id="pl-shuffle">Shuffle</button>
            </div>
            <button class="ar-btn" id="pl-ready">Ready — hide them</button>
            <button class="ar-btn ar-btn--ghost" id="pl-unready" hidden>Move my boats</button>
          </div>

          <div id="act" hidden>
            <div class="sh-row">
              <button class="sh-mode" id="mode-fire" data-on="1">Torpedo</button>
              <button class="sh-mode" id="mode-sonar">Sonar · <b id="sonar-left">2</b></button>
            </div>
            <button class="ar-btn" id="act-fire" disabled>Pick a square</button>
          </div>
        </section>

        <section class="sh-feed" id="feed"></section>
      </div>

      <div>
        <div class="sh-lower">
          <section class="sh-board sh-board--mini" id="mini-wrap">
            <div class="sh-board__label"><span id="mini-label">Your waters</span><span id="mini-meta"></span></div>
            <div class="sh-grid sh-grid--mini">
              <div class="sh-cols"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div>
              <div class="sh-rows"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span></div>
              <canvas class="sh-canvas" id="cv-mini" data-board="mini"></canvas>
            </div>
          </section>

          <section class="sh-fleets">
            <h3>Your fleet</h3>
            <ul id="fleet-mine"></ul>
            <h3 id="fleet-theirs-h">Their fleet</h3>
            <ul id="fleet-theirs"></ul>
          </section>
        </div>

        <div class="sh-foot">
          <div class="ar-players" id="players" style="margin-top:0"></div>
          <button class="sh-concede" id="concede" hidden>Surrender</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sh-over" id="over" hidden>
    <div class="sh-over__inner" id="over-inner"></div>
  </div>

  <script type="module">
    import { mountArcade, shareRoom, escapeHtml, mulberry32 } from '/arcade/shared/room.js';

    const SLUG = 'rotto-sub-hunt';
    const SIZE = 8;
    const CELL = 32;               // board texture pixels per cell — sprites are drawn 1:1
    const TEX = SIZE * CELL;       // 256
    const COLS = 'ABCDEFGH';
    const FLEET = [
      { id: 'sub', name: 'Collins-class sub', len: 4 },
      { id: 'ferry', name: 'Rotto ferry', len: 3 },
      { id: 'patrol', name: 'Patrol boat', len: 3 },
      { id: 'tinny', name: 'Tinny', len: 2 },
    ];
    const SHIP_NAME = Object.fromEntries(FLEET.map((f) => [f.id, f.name]));
    const coord = (x, y) => `${COLS[x]}${y + 1}`;

    // ── Elements ───────────────────────────────────────────────────────────
    const $ = (id) => document.getElementById(id);
    const gameEl = $('game'), overEl = $('over'), overInner = $('over-inner');

    // ── State ──────────────────────────────────────────────────────────────
    let G = null;                  // latest game view from the server
    let players = [];
    let mySeat = 0, isHost = false;
    let msLeftAtSync = null, syncAt = 0, phaseTotal = 1, phaseKey = '';
    let lastFxN = null;            // highest event number already animated
    let overPeek = false;          // game-over screen dismissed to look at the boards
    let pending = false;           // a shot is in flight; don't double-send

    // Placement (local until Ready)
    let fleet = randomFleet();
    let selId = null;
    let placingGame = -1;
    let drag = null;               // { id, offset, startCell, moved, preview }
    let badFlash = null;           // { cells, until }

    // Battle
    let mainShows = 'theirs';      // which waters the big board is showing
    let holdUntil = 0;             // don't swap boards before this (performance.now())
    const HOLD_MS = 1400;
    let mode = 'fire';
    let aim = null;                // { x, y }
    let hover = null;

    // ── Art ────────────────────────────────────────────────────────────────
    const ART = {};
    const WRECK = {};
    for (const name of ['sub', 'ferry', 'patrol', 'tinny', 'quokka']) {
      const img = new Image();
      img.src = `/arcade/rotto-sub-hunt/art/${name}.png`;
      img.onload = () => {
        ART[name] = img;
        if (name !== 'quokka') WRECK[name] = makeWreck(img);
      };
    }
    // A sunk boat: the same sprite, scorched and half under.
    function makeWreck(img) {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0);
      x.globalCompositeOperation = 'source-atop';
      x.fillStyle = 'rgba(22, 10, 8, 0.62)';
      x.fillRect(0, 0, c.width, c.height);
      const rnd = mulberry32(img.width * 7 + img.height);
      x.fillStyle = 'rgba(0, 0, 0, 0.55)';
      for (let i = 0; i < img.width / 3; i++) x.fillRect(Math.floor(rnd() * c.width), Math.floor(rnd() * c.height), 2, 2);
      return c;
    }

    // ── Sound — a tiny synth, no files ────────────────────────────────────
    let actx = null;
    let muted = lsGet('arcade:muted') === '1';
    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } }
    function audio() {
      if (muted) return null;
      if (!actx) {
        try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
      }
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      return actx;
    }
    function env(g, t0, dur, vol) {
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    }
    function tone({ f = 440, f2 = null, dur = 0.2, type = 'square', vol = 0.06, at = 0 }) {
      const a = audio(); if (!a) return;
      const t0 = a.currentTime + at;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      env(g, t0, dur, vol);
      o.connect(g).connect(a.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
    let noiseBuf = null;
    function noise({ dur = 0.4, vol = 0.2, freq = 800, f2 = null, at = 0 }) {
      const a = audio(); if (!a) return;
      if (!noiseBuf) {
        noiseBuf = a.createBuffer(1, a.sampleRate * 1.5, a.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const t0 = a.currentTime + at;
      const src = a.createBufferSource(), flt = a.createBiquadFilter(), g = a.createGain();
      src.buffer = noiseBuf;
      flt.type = 'lowpass';
      flt.frequency.setValueAtTime(freq, t0);
      if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      env(g, t0, dur, vol);
      src.connect(flt).connect(g).connect(a.destination);
      src.start(t0); src.stop(t0 + dur + 0.05);
    }
    const SFX = {
      fire() { noise({ dur: 0.22, vol: 0.1, freq: 2600, f2: 300 }); tone({ f: 240, f2: 70, dur: 0.22, type: 'triangle', vol: 0.07 }); },
      miss() { noise({ dur: 0.35, vol: 0.16, freq: 1800, f2: 350, at: 0.04 }); tone({ f: 900, f2: 260, dur: 0.12, type: 'sine', vol: 0.05, at: 0.04 }); },
      hit() { noise({ dur: 0.7, vol: 0.32, freq: 900, f2: 70 }); tone({ f: 130, f2: 38, dur: 0.5, type: 'sawtooth', vol: 0.1 }); },
      sunk() { SFX.hit(); noise({ dur: 1.3, vol: 0.28, freq: 520, f2: 50, at: 0.28 }); tone({ f: 310, f2: 55, dur: 1.1, type: 'square', vol: 0.05, at: 0.3 }); },
      quokka() { tone({ f: 1250, f2: 1900, dur: 0.08, vol: 0.05 }); tone({ f: 1500, f2: 2300, dur: 0.08, vol: 0.05, at: 0.1 }); tone({ f: 720, f2: 380, dur: 0.26, type: 'triangle', vol: 0.07, at: 0.22 }); },
      sonar() { tone({ f: 1320, dur: 0.9, type: 'sine', vol: 0.11 }); tone({ f: 1320, dur: 0.5, type: 'sine', vol: 0.035, at: 0.5 }); },
      turn() { tone({ f: 660, dur: 0.09, vol: 0.045 }); tone({ f: 990, dur: 0.13, vol: 0.045, at: 0.1 }); },
      win() { [523, 659, 784, 1047].forEach((f, i) => tone({ f, dur: 0.24, vol: 0.05, at: i * 0.13 })); },
      lose() { [392, 330, 262, 196].forEach((f, i) => tone({ f, dur: 0.32, type: 'triangle', vol: 0.08, at: i * 0.18 })); },
    };
    const buzz = (p) => { try { navigator.vibrate?.(p); } catch { /* not supported */ } };
    document.addEventListener('pointerdown', () => audio(), { once: true });

    $('h-mute').dataset.off = muted ? '1' : '0';
    $('h-mute').addEventListener('click', () => {
      muted = !muted;
      lsSet('arcade:muted', muted ? '1' : '0');
      $('h-mute').dataset.off = muted ? '1' : '0';
      if (!muted) SFX.turn();
    });

    // ── Boards ─────────────────────────────────────────────────────────────
    function makeBoard(id) {
      const canvas = $(id);
      const view = canvas.getContext('2d');
      const tex = document.createElement('canvas');
      tex.width = TEX; tex.height = TEX;
      const t = tex.getContext('2d');
      t.imageSmoothingEnabled = false;
      return { canvas, view, tex, t };
    }
    const MAIN = makeBoard('cv-main');
    const MINI = makeBoard('cv-mini');

    function sizeCanvas(b) {
      const r = b.canvas.getBoundingClientRect();
      if (!r.width) return;
      const px = Math.max(TEX, Math.round(r.width * (window.devicePixelRatio || 1)));
      if (b.canvas.width !== px) { b.canvas.width = px; b.canvas.height = px; }
    }

    // Waves are seeded so both phones show the same sea, but each board differs.
    function makeWaves(seed) {
      const rnd = mulberry32(seed);
      return Array.from({ length: 70 }, () => ({
        x: rnd() * TEX, y: Math.floor(rnd() * TEX), len: 2 + Math.floor(rnd() * 5),
        ph: rnd() * 6.28, sp: 0.6 + rnd() * 1.4, dr: 1.5 + rnd() * 3,
      }));
    }
    MAIN.waves = makeWaves(11);
    MINI.waves = makeWaves(29);

    const PAL = {
      deep: '#0b3a5c', deep2: '#0d4166', light: '#1d6f9b', light2: '#4fb2d8', foam: '#d8f1fa',
      grid: 'rgba(3, 22, 40, 0.6)',
    };

    function drawWater(b, t) {
      const c = b.t;
      c.fillStyle = PAL.deep;
      c.fillRect(0, 0, TEX, TEX);
      c.fillStyle = PAL.deep2;
      for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if ((x + y) % 2) c.fillRect(x * CELL, y * CELL, CELL, CELL);
      for (const w of b.waves) {
        const a = (Math.sin(t * w.sp + w.ph) + 1) / 2;
        if (a < 0.3) continue;
        c.fillStyle = a > 0.82 ? PAL.light2 : PAL.light;
        const xx = Math.floor((w.x + t * w.dr) % TEX);
        c.fillRect(xx, w.y, w.len, 1);
      }
      c.fillStyle = PAL.grid;
      for (let i = 1; i < SIZE; i++) {
        c.fillRect(i * CELL, 0, 1, TEX);
        c.fillRect(0, i * CELL, TEX, 1);
      }
    }

    function drawShip(c, ship, { wreck = false, alpha = 1, bob = 0, outline = null } = {}) {
      const img = wreck ? WRECK[ship.id] : ART[ship.id];
      const L = ship.len * CELL;
      c.save();
      c.globalAlpha = alpha;
      if (ship.dir === 'h') {
        c.translate(ship.x * CELL, ship.y * CELL + bob);
      } else {
        c.translate(ship.x * CELL + CELL - bob, ship.y * CELL);
        c.rotate(Math.PI / 2);
      }
      if (img) c.drawImage(img, 0, 0, L, CELL);
      else { c.fillStyle = wreck ? '#3a2a28' : '#8c95a3'; c.fillRect(3, 9, L - 6, 14); }
      if (outline) {
        c.globalAlpha = 1;
        c.strokeStyle = outline;
        c.lineWidth = 2;
        c.strokeRect(1, 1, L - 2, CELL - 2);
      }
      c.restore();
    }

    function shipCells(s) {
      return Array.from({ length: s.len }, (_, k) => ({ x: s.x + (s.dir === 'h' ? k : 0), y: s.y + (s.dir === 'v' ? k : 0) }));
    }

    // Burning wreckage on a hit cell: flickering pixel flame + rising smoke.
    function drawFire(c, cx, cy, t, seed, small = false) {
      const px = cx * CELL, py = cy * CELL;
      const f = Math.floor(t * 9 + seed) % 3;
      const s = small ? 0.7 : 1;
      const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(px + 16 + x * s), Math.round(py + 18 + y * s), Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s))); };
      // smoke first so the flame sits on top
      for (let k = 0; k < 3; k++) {
        const ph = ((t * 0.7 + k / 3 + seed * 0.13) % 1);
        const sz = 3 + Math.floor(ph * 4);
        c.globalAlpha = 0.55 * (1 - ph);
        R(-2 + Math.sin(ph * 6 + k) * 3 - sz / 2, -8 - ph * 18, sz, sz, k % 2 ? '#3b3f48' : '#555a66');
      }
      c.globalAlpha = 1;
      R(-7, 2, 14, 5, '#b8321f');
      R(-6, -3 - f, 12, 7, '#e8571e');
      R(-4, -7 - (f === 1 ? 2 : 0), 8, 7, '#ff9a2e');
      R(-2, -10 - f, 4, 6, '#ffd166');
      R(-1, -12 - (f === 2 ? 2 : 0), 2, 3, '#fff3c4');
      if (f === 0) R(4, -6, 2, 2, '#ffd166');
      if (f === 2) R(-6, -8, 2, 2, '#ff9a2e');
    }

    function drawSplashMark(c, cx, cy) {
      const px = cx * CELL + 16, py = cy * CELL + 16;
      c.fillStyle = 'rgba(216, 241, 250, 0.75)';
      for (let k = 0; k < 12; k++) {
        const a = (k / 12) * Math.PI * 2;
        c.fillRect(Math.round(px + Math.cos(a) * 7) - 1, Math.round(py + Math.sin(a) * 7) - 1, 2, 2);
      }
      c.fillStyle = 'rgba(216, 241, 250, 0.9)';
      c.fillRect(px - 2, py - 2, 4, 4);
      c.fillStyle = PAL.light2;
      c.fillRect(px - 1, py - 1, 2, 2);
    }

    function drawQuokka(c, cx, cy, t, { bob = true, alpha = 1, mark = false } = {}) {
      const img = ART.quokka;
      const dy = bob ? Math.round(Math.sin(t * 3 + cx * 1.7 + cy) * 1.5) : 0;
      c.save();
      c.globalAlpha = alpha;
      if (img) c.drawImage(img, cx * CELL, cy * CELL + dy, CELL, CELL);
      else { c.fillStyle = '#b07040'; c.fillRect(cx * CELL + 10, cy * CELL + 10 + dy, 12, 12); }
      c.restore();
      if (mark) {
        // the ranger's "!" — you got fined for this one
        c.fillStyle = '#ff6b6b';
        c.fillRect(cx * CELL + 25, cy * CELL + 2, 5, 11);
        c.fillStyle = '#fff';
        c.fillRect(cx * CELL + 27, cy * CELL + 4, 1, 4);
        c.fillRect(cx * CELL + 27, cy * CELL + 10, 1, 1);
      }
    }

    function drawPing(c, p, t, fresh, shotsUnder) {
      const x0 = Math.max(0, p.x - 1) * CELL, y0 = Math.max(0, p.y - 1) * CELL;
      const x1 = Math.min(SIZE, p.x + 2) * CELL, y1 = Math.min(SIZE, p.y + 2) * CELL;
      // dashed pixel frame round the 3×3
      c.fillStyle = fresh ? 'rgba(95, 217, 255, 0.95)' : 'rgba(95, 217, 255, 0.45)';
      for (let x = x0; x < x1; x += 6) { c.fillRect(x, y0, 3, 2); c.fillRect(x, y1 - 2, 3, 2); }
      for (let y = y0; y < y1; y += 6) { c.fillRect(x0, y, 2, 3); c.fillRect(x1 - 2, y, 2, 3); }
      // readout in the middle cell — tucked into its corner if that square has
      // since been shot, so it never hides the marker underneath
      const shot = shotsUnder && shotsUnder[p.y * SIZE + p.x] !== '.';
      if (shot) {
        const px = p.x * CELL + 1, py = p.y * CELL + 1;
        c.fillStyle = 'rgba(3, 18, 32, 0.85)';
        c.fillRect(px, py, 11, 11);
        c.font = '8px "Press Start 2P", monospace';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillStyle = p.ships ? '#ffd166' : '#5fd9ff';
        c.fillText(String(p.ships), px + 6, py + 6);
        return;
      }
      const cx = p.x * CELL + 16, cy = p.y * CELL + 16;
      c.fillStyle = 'rgba(3, 18, 32, 0.78)';
      c.fillRect(cx - 13, cy - 13, 26, p.quokkas ? 26 : 22);
      c.font = '12px "Press Start 2P", monospace';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillStyle = p.ships ? '#ffd166' : '#5fd9ff';
      c.fillText(String(p.ships), cx, cy - (p.quokkas ? 3 : 0));
      if (p.quokkas) {
        // a tiny quokka head and how many were in range
        if (ART.quokka) c.drawImage(ART.quokka, cx - 11, cy + 2, 10, 10);
        c.font = '6px "Press Start 2P", monospace';
        c.fillStyle = '#ffd166';
        c.fillText(`×${p.quokkas}`, cx + 6, cy + 8);
      }
    }

    // ── Effects ────────────────────────────────────────────────────────────
    // Keyed by WHOSE waters they happen in, not by canvas: the two canvases
    // swap which waters they show as the turn changes hands.
    const FX = { mine: [], theirs: [] };
    function addFx(which, type, x, y, extra = {}) {
      FX[which].push({ type, x, y, t0: performance.now(), ...extra });
    }

    function drawFx(b, which, now) {
      const c = b.t;
      FX[which] = FX[which].filter((f) => now - f.t0 < (f.life || 900) + (f.delay || 0));
      for (const f of FX[which]) {
        const age = (now - f.t0 - (f.delay || 0)) / 1000;
        if (age < 0) continue;
        const px = f.x * CELL + 16, py = f.y * CELL + 16;
        const rnd = mulberry32(f.t0 | 0);
        if (f.type === 'boom') {
          if (age < 0.12) {
            c.fillStyle = 'rgba(255, 244, 200, 0.9)';
            const r = 6 + age * 120;
            c.fillRect(px - r / 2, py - r / 2, r, r);
          }
          for (let k = 0; k < 16; k++) {
            const a = rnd() * 6.28, v = 30 + rnd() * 60;
            const x = px + Math.cos(a) * v * age, y = py + Math.sin(a) * v * age + 40 * age * age;
            c.globalAlpha = Math.max(0, 1 - age / 0.8);
            c.fillStyle = k % 3 === 0 ? '#ffd166' : k % 3 === 1 ? '#ff7a3d' : '#e8571e';
            c.fillRect(Math.round(x), Math.round(y), 2, 2);
          }
          c.globalAlpha = 1;
        } else if (f.type === 'splash') {
          const r = 4 + age * 26;
          c.globalAlpha = Math.max(0, 1 - age / 0.7);
          c.fillStyle = PAL.foam;
          for (let k = 0; k < 16; k++) {
            const a = (k / 16) * 6.28;
            c.fillRect(Math.round(px + Math.cos(a) * r), Math.round(py + Math.sin(a) * r), 2, 2);
          }
          for (let k = 0; k < 8; k++) {
            const vx = (rnd() - 0.5) * 30, vy = -40 - rnd() * 40;
            c.fillRect(Math.round(px + vx * age), Math.round(py + vy * age + 160 * age * age), 2, 2);
          }
          c.globalAlpha = 1;
        } else if (f.type === 'sonar') {
          for (let k = 0; k < 3; k++) {
            const a2 = age - k * 0.22;
            if (a2 < 0) continue;
            const r = a2 * 70;
            c.globalAlpha = Math.max(0, 0.9 - a2 / 1.0);
            c.fillStyle = '#5fd9ff';
            for (let s = 0; s < 28; s++) {
              const ang = (s / 28) * 6.28;
              c.fillRect(Math.round(px + Math.cos(ang) * r), Math.round(py + Math.sin(ang) * r), 2, 2);
            }
          }
          c.globalAlpha = 1;
        } else if (f.type === 'bonk') {
          const hop = Math.sin(Math.min(1, age / 0.5) * Math.PI) * 10;
          drawQuokka(c, f.x, f.y - hop / CELL, 0, { bob: false });
          c.fillStyle = '#ffd166';
          for (let k = 0; k < 4; k++) {
            const a = age * 5 + k * 1.57;
            c.fillRect(Math.round(px + Math.cos(a) * 12), Math.round(py - 12 + Math.sin(a) * 4 - hop), 2, 2);
          }
        } else if (f.type === 'banner') {
          const a = age < 0.12 ? age / 0.12 : age > 0.9 ? Math.max(0, 1 - (age - 0.9) / 0.3) : 1;
          c.globalAlpha = a * 0.82;
          c.fillStyle = '#030a14';
          c.fillRect(0, 110, TEX, 36);
          c.globalAlpha = a;
          c.font = '16px "Press Start 2P", monospace';
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.fillStyle = '#000';
          c.fillText(f.text, TEX / 2 + 2, 130);
          c.fillStyle = f.color;
          c.fillText(f.text, TEX / 2, 128);
          c.globalAlpha = 1;
        } else if (f.type === 'aim-bad') {
          c.globalAlpha = Math.max(0, 1 - age / 0.5);
          c.strokeStyle = '#ff6b6b';
          c.lineWidth = 2;
          c.strokeRect(f.x * CELL + 1, f.y * CELL + 1, (f.w || 1) * CELL - 2, (f.h || 1) * CELL - 2);
          c.globalAlpha = 1;
        }
      }
    }

    function brackets(c, x, y, w, h, col, t) {
      const pulse = Math.floor(t * 4) % 2 ? 0 : 1;
      const x0 = x * CELL + 1 - pulse, y0 = y * CELL + 1 - pulse;
      const x1 = (x + w) * CELL - 1 + pulse, y1 = (y + h) * CELL - 1 + pulse;
      const L = 7;
      c.fillStyle = col;
      c.fillRect(x0, y0, L, 2); c.fillRect(x0, y0, 2, L);
      c.fillRect(x1 - L, y0, L, 2); c.fillRect(x1 - 2, y0, 2, L);
      c.fillRect(x0, y1 - 2, L, 2); c.fillRect(x0, y1 - L, 2, L);
      c.fillRect(x1 - L, y1 - 2, L, 2); c.fillRect(x1 - 2, y1 - L, 2, L);
    }

    // ── Board renderers ────────────────────────────────────────────────────
    // "mine": my own waters — my boats, the shots that came in, my quokkas.
    function renderMine(b, t, now, { placing = false } = {}) {
      const c = b.t;
      drawWater(b, t);
      const board = G?.mine;
      const shots = board?.shots || '.'.repeat(64);

      const ships = placing ? placementShips() : board?.ships || [];
      for (const s of ships) {
        const bob = s.sunk ? 0 : Math.round(Math.sin(t * 1.6 + s.x * 2 + s.y) * 0.8);
        const outline = placing && s.id === selId ? (Math.floor(t * 4) % 2 ? '#ffd166' : '#ffb648') : null;
        drawShip(c, s, { wreck: !!s.sunk, bob, outline, alpha: placing && drag?.id === s.id && drag.moved ? 0.35 : 1 });
      }
      if (placing && drag?.moved && drag.preview) {
        const ok = placementValid(drag.preview, drag.id);
        drawShip(c, drag.preview, { alpha: 0.85, outline: ok ? '#6ee7a5' : '#ff6b6b' });
      }
      if (!placing) {
        for (const q of board?.quokkas || []) drawQuokka(c, q.x, q.y, t);
        for (let i = 0; i < 64; i++) {
          const ch = shots[i];
          const x = i % SIZE, y = Math.floor(i / SIZE);
          if (ch === 'o') drawSplashMark(c, x, y);
          else if (ch === 'x') drawFire(c, x, y, t, i, isSunkCell(ships, x, y));
          else if (ch === 'q') drawQuokka(c, x, y, t, { bob: false, alpha: 0.55, mark: true });
        }
        const latest = board?.pings?.at(-1);
        for (const p of board?.pings || []) drawPing(c, p, t, p === latest && G.n - p.n < 2, shots);
      }
      drawFx(b, 'mine', now);
    }

    // "theirs": what I know about their waters.
    function renderTheirs(b, t, now) {
      const c = b.t;
      drawWater(b, t);
      const board = G?.theirs;
      if (!board) return;
      const shots = board.shots;
      const over = G.phase === 'over';
      for (const s of board.ships) drawShip(c, s, { wreck: s.sunk, alpha: s.sunk ? 1 : 0.75 });
      if (over && board.quokkas) for (const q of board.quokkas) drawQuokka(c, q.x, q.y, t);
      for (let i = 0; i < 64; i++) {
        const ch = shots[i];
        const x = i % SIZE, y = Math.floor(i / SIZE);
        if (ch === 'o') drawSplashMark(c, x, y);
        else if (ch === 'x') drawFire(c, x, y, t, i, isSunkCell(board.ships, x, y));
        else if (ch === 'q') drawQuokka(c, x, y, t, { bob: false, alpha: 0.6, mark: true });
      }
      const latest = board.pings.at(-1);
      for (const p of board.pings) drawPing(c, p, t, p === latest && G.n - p.n < 2, shots);

      if (G.myTurn && b === MAIN) {
        const target = aim || hover;
        if (target) {
          if (mode === 'sonar') {
            const x0 = Math.max(0, target.x - 1), y0 = Math.max(0, target.y - 1);
            const x1 = Math.min(SIZE, target.x + 2), y1 = Math.min(SIZE, target.y + 2);
            c.fillStyle = 'rgba(95, 217, 255, 0.14)';
            c.fillRect(x0 * CELL, y0 * CELL, (x1 - x0) * CELL, (y1 - y0) * CELL);
            brackets(c, x0, y0, x1 - x0, y1 - y0, aim ? '#5fd9ff' : 'rgba(95,217,255,0.5)', t);
          } else {
            brackets(c, target.x, target.y, 1, 1, aim ? '#ffb648' : 'rgba(255,182,72,0.5)', t);
          }
        }
      }
      drawFx(b, 'theirs', now);
    }

    function isSunkCell(ships, x, y) {
      return ships.some((s) => s.sunk && shipCells(s).some((cc) => cc.x === x && cc.y === y));
    }

    function blit(b) {
      sizeCanvas(b);
      const v = b.view;
      v.imageSmoothingEnabled = false;
      v.drawImage(b.tex, 0, 0, b.canvas.width, b.canvas.height);
    }

    // Which waters the big board shows. Your turn: theirs. Their turn: yours,
    // so you watch the shot come in. Each swap waits out `holdUntil`, so the
    // result of the last shot stays on screen long enough to see it.
    function wantMain() {
      return G?.phase === 'battle' && !G.myTurn ? 'mine' : 'theirs';
    }

    let t0 = performance.now();
    function frame(now) {
      const t = (now - t0) / 1000;
      if (G && !gameEl.hidden) {
        if (G.spectator) {
          drawWater(MAIN, t);
        } else if (G.phase === 'placing') {
          renderMine(MAIN, t, now, { placing: !G.ready?.me });
        } else if (G.theirs) {
          const want = wantMain();
          if (want !== mainShows && now >= holdUntil) {
            mainShows = want;
            aim = null;
            render();
          }
          if (mainShows === 'theirs') { renderTheirs(MAIN, t, now); renderMine(MINI, t, now); }
          else { renderMine(MAIN, t, now); renderTheirs(MINI, t, now); }
          blit(MINI);
        } else {
          drawWater(MAIN, t);
        }
        blit(MAIN);
        tickTimer();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ── Placement (local) ──────────────────────────────────────────────────
    function randomFleet() {
      for (;;) {
        const taken = new Set();
        const out = [];
        let ok = true;
        for (const def of FLEET) {
          let placed = false;
          for (let a = 0; a < 200 && !placed; a++) {
            const dir = Math.random() < 0.5 ? 'h' : 'v';
            const x = Math.floor(Math.random() * (dir === 'h' ? SIZE - def.len + 1 : SIZE));
            const y = Math.floor(Math.random() * (dir === 'v' ? SIZE - def.len + 1 : SIZE));
            const s = { id: def.id, len: def.len, x, y, dir };
            const cells = shipCells(s).map((cc) => cc.y * SIZE + cc.x);
            if (cells.some((k) => taken.has(k))) continue;
            cells.forEach((k) => taken.add(k));
            out.push(s);
            placed = true;
          }
          if (!placed) { ok = false; break; }
        }
        if (ok) return out;
      }
    }

    function placementShips() { return fleet; }

    // The arrangement you're working on survives a refresh (per room + game).
    const draftKey = (code, game) => `arcade:sh-draft:${code}:${game}`;
    function saveDraft() {
      if (!G || !room.code()) return;
      lsSet(draftKey(room.code(), G.game), JSON.stringify(fleet));
    }
    function loadDraft(code, game) {
      try {
        const f = JSON.parse(lsGet(draftKey(code, game)) || 'null');
        if (!Array.isArray(f) || f.length !== FLEET.length) return null;
        const ids = new Set(f.map((s) => s.id));
        if (FLEET.some((d) => !ids.has(d.id))) return null;
        const clean = f.map((s) => ({ id: s.id, len: FLEET.find((d) => d.id === s.id).len, x: s.x, y: s.y, dir: s.dir }));
        const was = fleet;
        fleet = clean;
        const ok = clean.every((s) => placementValid(s, s.id) && (s.dir === 'h' || s.dir === 'v'));
        fleet = was;
        return ok ? clean : null;
      } catch {
        return null;
      }
    }
    function shipAtLocal(x, y) { return fleet.find((s) => shipCells(s).some((cc) => cc.x === x && cc.y === y)) || null; }
    function placementValid(s, ignoreId) {
      const cells = shipCells(s);
      if (cells.some((cc) => cc.x < 0 || cc.y < 0 || cc.x >= SIZE || cc.y >= SIZE)) return false;
      return !fleet.some((o) => o.id !== ignoreId && shipCells(o).some((oc) => cells.some((cc) => cc.x === oc.x && cc.y === oc.y)));
    }
    function clampShip(s) {
      return {
        ...s,
        x: Math.max(0, Math.min(s.x, s.dir === 'h' ? SIZE - s.len : SIZE - 1)),
        y: Math.max(0, Math.min(s.y, s.dir === 'v' ? SIZE - s.len : SIZE - 1)),
      };
    }
    function flashBad(s) {
      addFx('mine', 'aim-bad', s.x, s.y, { w: s.dir === 'h' ? s.len : 1, h: s.dir === 'v' ? s.len : 1, life: 500 });
      tone({ f: 180, dur: 0.12, type: 'square', vol: 0.04 });
    }
    function commitMove(id, next) {
      if (!placementValid(next, id)) { flashBad(next); return false; }
      fleet = fleet.map((s) => (s.id === id ? next : s));
      saveDraft();
      tone({ f: 520, f2: 700, dur: 0.06, type: 'triangle', vol: 0.05 });
      return true;
    }
    function rotateSelected() {
      const s = fleet.find((f) => f.id === (selId || fleet[0].id));
      if (!s) return;
      selId = s.id;
      const dir = s.dir === 'h' ? 'v' : 'h';
      // Turn about the bow-anchor; if that collides, nudge along the new axis.
      const base = clampShip({ ...s, dir });
      const tries = [0, -1, 1, -2, 2, -3, 3];
      for (const d of tries) {
        const cand = clampShip({ ...base, x: base.x + (dir === 'h' ? d : 0), y: base.y + (dir === 'v' ? d : 0) });
        if (placementValid(cand, s.id)) { commitMove(s.id, cand); return; }
      }
      for (const d of tries) {
        const cand = clampShip({ ...base, x: base.x + (dir === 'v' ? d : 0), y: base.y + (dir === 'h' ? d : 0) });
        if (placementValid(cand, s.id)) { commitMove(s.id, cand); return; }
      }
      flashBad(base);
    }

    $('pl-rotate').addEventListener('click', rotateSelected);
    $('pl-shuffle').addEventListener('click', () => {
      fleet = randomFleet();
      saveDraft();
      tone({ f: 400, f2: 900, dur: 0.15, type: 'triangle', vol: 0.05 });
    });
    $('pl-ready').addEventListener('click', () => {
      selId = null;
      room.send({ t: 'ready', fleet: fleet.map(({ id, x, y, dir }) => ({ id, x, y, dir })) });
    });
    $('pl-unready').addEventListener('click', () => {
      // keep what is on the server as the starting point
      if (G?.mine?.ships?.length) fleet = G.mine.ships.map(({ id, len, x, y, dir }) => ({ id, len, x, y, dir }));
      room.send({ t: 'unready' });
    });

    // ── Pointer input on the main board ────────────────────────────────────
    function cellFromEvent(e) {
      const r = MAIN.canvas.getBoundingClientRect();
      const x = Math.floor(((e.clientX - r.left) / r.width) * SIZE);
      const y = Math.floor(((e.clientY - r.top) / r.height) * SIZE);
      if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) return null;
      return { x, y };
    }

    MAIN.canvas.addEventListener('pointerdown', (e) => {
      const cell = cellFromEvent(e);
      if (!cell || !G) return;
      if (G.phase === 'placing' && !G.ready?.me) {
        const s = shipAtLocal(cell.x, cell.y);
        if (s) {
          const offset = s.dir === 'h' ? cell.x - s.x : cell.y - s.y;
          drag = { id: s.id, offset, start: cell, moved: false, preview: null };
          MAIN.canvas.setPointerCapture?.(e.pointerId);
        }
      }
    });

    MAIN.canvas.addEventListener('pointermove', (e) => {
      const cell = cellFromEvent(e);
      if (G?.phase === 'battle') {
        hover = e.pointerType === 'mouse' && mainShows === 'theirs' ? cell : null;
        return;
      }
      if (!drag || !cell) return;
      if (cell.x !== drag.start.x || cell.y !== drag.start.y) drag.moved = true;
      const s = fleet.find((f) => f.id === drag.id);
      drag.preview = clampShip({
        ...s,
        x: s.dir === 'h' ? cell.x - drag.offset : cell.x,
        y: s.dir === 'v' ? cell.y - drag.offset : cell.y,
      });
    });

    MAIN.canvas.addEventListener('pointerleave', () => { hover = null; });
    MAIN.canvas.addEventListener('pointercancel', () => { drag = null; });

    MAIN.canvas.addEventListener('pointerup', (e) => {
      const cell = cellFromEvent(e);
      if (!G) return;

      if (G.phase === 'placing' && !G.ready?.me) {
        if (drag && drag.moved && drag.preview) {
          if (commitMove(drag.id, drag.preview)) selId = drag.id;
          drag = null;
          return;
        }
        drag = null;
        if (!cell) return;
        const s = shipAtLocal(cell.x, cell.y);
        if (s) {
          if (selId === s.id) rotateSelected();
          else { selId = s.id; tone({ f: 640, dur: 0.05, type: 'triangle', vol: 0.04 }); }
        } else if (selId) {
          const sel = fleet.find((f) => f.id === selId);
          commitMove(selId, clampShip({ ...sel, x: cell.x, y: cell.y }));
        }
        return;
      }

      if (G.phase === 'battle' && cell && mainShows === 'theirs') tapBattle(cell);
    });

    function tapBattle(cell) {
      if (!G.myTurn || pending) {
        if (!G.myTurn) addFx('theirs', 'aim-bad', cell.x, cell.y, { life: 400 });
        return;
      }
      const shot = G.theirs.shots[cell.y * SIZE + cell.x];
      if (mode === 'fire' && shot !== '.') {
        addFx('theirs', 'aim-bad', cell.x, cell.y, { life: 400 });
        return;
      }
      // Second tap on the same square commits — drunk-proof, but quick.
      if (aim && aim.x === cell.x && aim.y === cell.y) return commitAim();
      aim = cell;
      tone({ f: 880, dur: 0.04, type: 'square', vol: 0.03 });
      renderControls();
    }

    function commitAim() {
      if (!aim || !G?.myTurn || pending) return;
      if (mode === 'fire' && G.theirs.shots[aim.y * SIZE + aim.x] !== '.') return;
      pending = true;
      if (mode === 'sonar') {
        room.send({ t: 'sonar', x: aim.x, y: aim.y });
        mode = 'fire'; // a ping is a one-off; the next tap shouldn't spend another
      } else { room.send({ t: 'fire', x: aim.x, y: aim.y }); SFX.fire(); }
      aim = null;
      renderControls();
      setTimeout(() => { pending = false; }, 2500); // safety: a dropped message never locks you out
    }

    $('act-fire').addEventListener('click', commitAim);
    $('mode-fire').addEventListener('click', () => setMode('fire'));
    $('mode-sonar').addEventListener('click', () => setMode('sonar'));
    function setMode(m) {
      if (m === 'sonar' && !(G?.sonarLeft > 0)) return;
      mode = m;
      if (aim && mode === 'fire' && G?.theirs?.shots[aim.y * SIZE + aim.x] !== '.') aim = null;
      renderControls();
      renderStatus();
    }

    // Keyboard, for laptops: arrows move the aim, Enter fires, S toggles sonar.
    document.addEventListener('keydown', (e) => {
      if (!G || G.phase !== 'battle' || !G.myTurn || !overEl.hidden || mainShows !== 'theirs') return;
      const k = e.key;
      if (k === 'Enter' || k === ' ') { if (aim) { e.preventDefault(); commitAim(); } return; }
      if (k === 's' || k === 'S') { setMode(mode === 'fire' ? 'sonar' : 'fire'); return; }
      const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
      if (!d) return;
      e.preventDefault();
      const a = aim || { x: 3, y: 3 };
      aim = { x: Math.max(0, Math.min(7, a.x + d[0])), y: Math.max(0, Math.min(7, a.y + d[1])) };
      renderControls();
    });

    // Concede needs two taps (no browser confirm dialogs).
    let concedeArm = 0;
    $('concede').addEventListener('click', () => {
      const btn = $('concede');
      if (Date.now() - concedeArm < 3000) {
        room.send({ t: 'concede' });
        concedeArm = 0;
        btn.dataset.arm = '0';
        btn.textContent = 'Surrender';
        return;
      }
      concedeArm = Date.now();
      btn.dataset.arm = '1';
      btn.textContent = 'Really? Tap again';
      setTimeout(() => {
        if (Date.now() - concedeArm >= 2900) { btn.dataset.arm = '0'; btn.textContent = 'Surrender'; }
      }, 3000);
    });

    // ── Names ──────────────────────────────────────────────────────────────
    function nameOf(seat) {
      if (G?.bot === seat) return 'the CPU skipper';
      return players.find((p) => p.seat === seat)?.name || `Player ${seat + 1}`;
    }
    const cap = (str) => str.charAt(0).toUpperCase() + str.slice(1);
    const short = (str, n = 11) => (str.length > n ? `${str.slice(0, n - 1).trimEnd()}…` : str);
    const themSeat = () => 1 - mySeat;
    const isMe = (seat) => seat === mySeat;

    // ── Client boot ────────────────────────────────────────────────────────
    const room = mountArcade({
      slug: SLUG,
      title: 'Rotto Sub Hunt',
      tagline:
        "Battleship, off Rottnest. Hide a sub, a Rotto ferry, a patrol boat and a tinny, then take turns firing at each other's waters. There are quokkas paddling about out there. Do not shoot the quokkas.",
      soloNote: "On your own? Start a game and the CPU skipper takes the other side.",
      gateEl: $('gate'),
      onJoined: () => { gameEl.hidden = false; },
      onState: (msg) => {
        players = msg.players;
        mySeat = msg.seat;
        isHost = msg.host;
        $('h-code').textContent = msg.code;

        const g = msg.game;
        const prev = G;

        // Phase timer: interpolate between broadcasts rather than freezing.
        const turnKey = `${g.phase}:${g.game}:${g.turn}`;
        if (turnKey !== phaseKey) {
          phaseKey = turnKey;
          phaseTotal = g.phase === 'placing' ? 90000 : g.turn === g.bot ? 2200 : 30000;
        }
        msLeftAtSync = g.msLeft;
        syncAt = performance.now();

        // A new game: fresh local fleet, reset the view state.
        if (g.phase === 'placing' && g.game !== placingGame) {
          placingGame = g.game;
          fleet = g.ready?.me && g.mine?.ships?.length
            ? g.mine.ships.map(({ id, len, x, y, dir }) => ({ id, len, x, y, dir }))
            : loadDraft(msg.code, g.game) || randomFleet();
          if (!g.ready?.me) lsSet(draftKey(msg.code, g.game), JSON.stringify(fleet));
          selId = null;
          overPeek = false;
          mode = 'fire';
          aim = null;
          mainShows = 'theirs';
          holdUntil = 0;
        }
        if (g.phase !== 'battle') aim = null;
        if (g.phase === 'over' && prev?.phase !== 'over') overPeek = false;
        if (prev && prev.n !== g.n) pending = false;
        if (mode === 'sonar' && !(g.sonarLeft > 0)) mode = 'fire';

        G = g;
        playNewEvents(prev);
        render();
      },
    });

    const msLeft = () =>
      msLeftAtSync == null ? null : Math.max(0, msLeftAtSync - (performance.now() - syncAt));

    let autoReadyGame = -1;
    function tickTimer() {
      const fill = $('s-timer');
      const left = msLeft();
      // Out of placement time: lock in what's on screen, rather than letting
      // the server swap it for a random fleet.
      if (G?.phase === 'placing' && !G.ready?.me && !G.spectator && left != null && left < 1500 && autoReadyGame !== G.game) {
        autoReadyGame = G.game;
        drag = null;
        selId = null;
        room.send({ t: 'ready', fleet: fleet.map(({ id, x, y, dir }) => ({ id, x, y, dir })) });
      }
      if (left == null || !G || (G.phase !== 'battle' && G.phase !== 'placing')) {
        fill.style.width = '0%';
        return;
      }
      const pct = Math.max(0, Math.min(1, left / phaseTotal));
      fill.style.width = `${(pct * 100).toFixed(1)}%`;
      fill.dataset.low = left < 8000 && G.phase === 'battle' && G.myTurn ? '1' : '0';
    }

    $('h-code').addEventListener('click', async () => {
      const r = await shareRoom(SLUG, room.code(), 'Rotto Sub Hunt');
      if (r === 'copied') {
        const el = $('h-code');
        el.textContent = 'LINK COPIED';
        clearTimeout(el.timer);
        el.timer = setTimeout(() => { el.textContent = room.code(); }, 1400);
      }
    });

    // ── Events → effects, sound, feed ──────────────────────────────────────
    function playNewEvents(prev) {
      if (!G.feed) { lastFxN = G.n; return; }
      if (lastFxN === null) { lastFxN = G.n; return; } // first state after (re)connect: no replays
      // After a long drop several events can arrive at once; only play the
      // last two rather than a barrage.
      const fresh = G.feed.filter((e) => e.n > lastFxN).slice(-2);
      lastFxN = Math.max(lastFxN, G.n);
      for (const ev of fresh) {
        const onTheirs = isMe(ev.by); // my action lands on their waters
        const b = onTheirs ? 'theirs' : 'mine';
        const wrap = b === mainShows ? 'main-wrap' : 'mini-wrap';
        if (ev.kind === 'shot' || ev.kind === 'sonar') holdUntil = performance.now() + HOLD_MS;
        const BANNER = {
          miss: ['SPLASH', '#d8f1fa'], hit: ['HIT!', '#ff7a3d'], sunk: ['SUNK!', '#ff6b6b'], quokka: ['QUOKKA!', '#ffd166'],
        };
        if (ev.kind === 'shot' && BANNER[ev.result]) {
          addFx(b, 'banner', 0, 0, { text: BANNER[ev.result][0], color: BANNER[ev.result][1], life: 1200, delay: 120 });
        } else if (ev.kind === 'sonar') {
          addFx(b, 'banner', 0, 0, { text: `PING: ${ev.ships}`, color: '#5fd9ff', life: 1200, delay: 500 });
        }
        if (ev.kind === 'shot') {
          if (ev.result === 'miss') { addFx(b, 'splash', ev.x, ev.y, { life: 700 }); SFX.miss(); }
          else if (ev.result === 'hit') {
            addFx(b, 'boom', ev.x, ev.y, { life: 800 });
            SFX.hit();
            if (!onTheirs) { shake(wrap); buzz([60, 40, 90]); }
          } else if (ev.result === 'sunk') {
            const ships = onTheirs ? G.theirs?.ships : G.mine?.ships;
            const s = ships?.find((sh) => sh.id === ev.ship);
            const cells = s ? shipCells(s) : [{ x: ev.x, y: ev.y }];
            cells.forEach((cc, i) => addFx(b, 'boom', cc.x, cc.y, { life: 900, delay: i * 120 }));
            SFX.sunk();
            shake(wrap);
            if (!onTheirs) buzz([100, 50, 200]);
          } else if (ev.result === 'quokka') {
            addFx(b, 'bonk', ev.x, ev.y, { life: 1100 });
            SFX.quokka();
          }
        } else if (ev.kind === 'sonar') {
          addFx(b, 'sonar', ev.x, ev.y, { life: 1300 });
          SFX.sonar();
        }
      }
      // It just became my turn.
      if (G.phase === 'battle' && G.myTurn && !(prev?.phase === 'battle' && prev?.myTurn)) {
        setTimeout(() => SFX.turn(), fresh.some((e) => e.kind !== 'first') ? HOLD_MS : 0);
        buzz(30);
      }
      if (G.phase === 'over' && prev?.phase === 'battle') {
        setTimeout(() => (G.winner === mySeat ? SFX.win() : SFX.lose()), HOLD_MS);
      }
    }

    function shake(id) {
      const el = $(id);
      el.classList.remove('sh-shake');
      void el.offsetWidth;
      el.classList.add('sh-shake');
    }

    function feedLine(ev) {
      const who = isMe(ev.by) ? 'You' : cap(nameOf(ev.by));
      const at = ev.x != null ? coord(ev.x, ev.y) : '';
      switch (ev.kind) {
        case 'first':
          return [isMe(ev.by) ? 'Coin toss: you shoot first.' : `Coin toss: ${nameOf(ev.by)} shoots first.`, ''];
        case 'timeout':
          return [`${who} ran out of time. Shot lost.`, ''];
        case 'fined':
          return [`${isMe(ev.by) ? 'You sit' : `${who} sits`} out a turn — quokka fine.`, 't-q'];
        case 'concede':
          return [`${who} surrendered. White flag up.`, ''];
        case 'sonar': {
          const tail = `${ev.ships} contact${ev.ships === 1 ? '' : 's'}${ev.quokkas ? `, ${ev.quokkas} quokka${ev.quokkas === 1 ? '' : 's'}` : ''}`;
          return isMe(ev.by)
            ? [`Sonar around ${at}: ${tail}.`, 't-sonar']
            : [`${who} pinged your waters around ${at}.`, 't-sonar'];
        }
        case 'shot': {
          if (ev.result === 'miss') return [`${who} fired at ${at}. Splash.`, ''];
          if (ev.result === 'hit') return [`${who} fired at ${at}. HIT.`, 't-hit'];
          if (ev.result === 'sunk') {
            const name = SHIP_NAME[ev.ship] || 'a boat';
            return isMe(ev.by) ? [`You sank their ${name}!`, 't-hit'] : [`${who} sank your ${name}.`, 't-hit'];
          }
          if (ev.result === 'quokka') {
            return isMe(ev.by)
              ? [`You hit a quokka at ${at}. The ranger fines you a turn.`, 't-q']
              : [`${who} hit a quokka at ${at}. They lose a turn.`, 't-q'];
          }
          return [`${who} fired at ${at}.`, ''];
        }
        default:
          return ['', ''];
      }
    }

    // ── Render (DOM) ───────────────────────────────────────────────────────
    function render() {
      if (!G) return;
      const ph = G.phase;
      const solo = G.mode === 'solo';

      // tally
      if (G.game > 0 && G.wins && !G.spectator) {
        const me = G.wins[mySeat] ?? 0, them = G.wins[themSeat()] ?? 0;
        $('h-tally').innerHTML = `You <b>${me}</b> – <b>${them}</b> ${escapeHtml(solo ? 'CPU' : nameOf(themSeat()))}`;
      } else $('h-tally').textContent = '';

      // which board is where
      const placing = ph === 'placing';
      const theirsLabel = G.mode === 'solo' ? "CPU's waters" : `${nameOf(themSeat())}'s waters`;
      $('main-label').textContent = G.spectator ? 'Off Rottnest' : placing || mainShows === 'mine' ? 'Your waters' : theirsLabel;
      if (G.spectator) $('main-meta').innerHTML = '';
      $('mini-label').textContent = mainShows === 'mine' ? theirsLabel : 'Your waters';
      $('mini-wrap').hidden = placing || ph === 'lobby' || !!G.spectator;

      renderStatus();
      renderControls();
      renderFeed();
      renderFleets();

      $('players').innerHTML = players
        .map((p) => `<span class="ar-player"><span class="ar-dot" data-on="${p.online ? 1 : 0}"></span>
          ${escapeHtml(p.name)}${p.seat === mySeat ? ' <span class="ar-you">you</span>' : ''}</span>`)
        .join('') + (solo ? '<span class="ar-player"><span class="ar-dot" data-on="1"></span>CPU skipper</span>' : '');
      $('concede').hidden = ph !== 'battle' || !!G.spectator;

      renderOverlay();
    }

    function renderStatus() {
      const st = $('status');
      let main = '', sub = '', tone2 = '';
      const them = short(nameOf(themSeat()), G.bot === themSeat() ? 16 : 11);
      if (G.spectator) {
        main = 'Spectating';
        sub = G.phase === 'over' ? "That CPU game's done — the next one is yours." : 'A game against the CPU is running in this room.';
      } else if (G.phase === 'lobby') {
        main = 'In the harbour';
        sub = 'Waiting to start.';
      } else if (G.phase === 'placing') {
        if (!G.ready.me) {
          main = 'Hide your fleet';
          sub = G.ready.them ? `${cap(them)} is ready and waiting.` : 'Four boats. Put them somewhere sneaky.';
          tone2 = 'go';
        } else {
          main = `Waiting on ${them}…`;
          sub = 'Your boats are in the water.';
        }
      } else if (G.phase === 'battle') {
        if (G.myTurn) {
          main = 'Your shot';
          tone2 = 'go';
          sub = mode === 'sonar' ? 'Sonar: pick the middle of a 3×3.' : 'Tap to aim, tap again to fire.';
          if (G.skipThem) sub = `${cap(them)} owes a turn — you go again after this.`;
        } else {
          main = `${cap(them)} is aiming…`;
          sub = G.skipMe ? 'You owe the ranger a turn for that quokka.' : 'Watch your waters.';
        }
      } else if (G.phase === 'over') {
        const won = G.winner === mySeat;
        main = won ? 'Victory' : 'Sunk';
        tone2 = won ? 'win' : 'lose';
        sub = G.conceded
          ? (won ? `${cap(them)} surrendered.` : 'You surrendered.')
          : won ? 'Every boat found.' : `${cap(them)} found every boat.`;
      }
      $('s-main').textContent = main;
      if (G.phase === 'over' && overPeek) {
        $('s-sub').innerHTML = `<button class="sh-concede" id="peek-back">Show results ↩</button>`;
      } else $('s-sub').textContent = sub;
      st.dataset.tone = tone2;
    }

    function renderControls() {
      if (!G) return;
      const placing = G.phase === 'placing' && !G.spectator;
      const battle = G.phase === 'battle' && !G.spectator;
      $('pl').hidden = !placing;
      $('act').hidden = !battle;
      // While arranging boats the board owns touch gestures (so a drag drags a
      // boat instead of scrolling the page); in battle, taps only.
      MAIN.canvas.style.touchAction = placing && !G.ready?.me ? 'none' : 'manipulation';

      if (placing) {
        const ready = !!G.ready.me;
        $('pl-rotate').disabled = ready;
        $('pl-shuffle').disabled = ready;
        $('pl-ready').hidden = ready;
        $('pl-unready').hidden = !ready || !!G.ready.them;
        $('pl-hint').textContent = ready
          ? 'Locked in. You can still move them until the other side is ready.'
          : 'Drag a boat, or tap it and then tap open water. Tap a picked-up boat again to turn it.';
        $('main-meta').innerHTML = '';
      }

      if (battle) {
        $('sonar-left').textContent = String(G.sonarLeft ?? 0);
        $('mode-fire').dataset.on = mode === 'fire' ? '1' : '0';
        $('mode-sonar').dataset.on = mode === 'sonar' ? '1' : '0';
        $('mode-sonar').disabled = !(G.sonarLeft > 0) || !G.myTurn;
        $('mode-fire').disabled = !G.myTurn;
        const btn = $('act-fire');
        btn.dataset.sonar = mode === 'sonar' ? '1' : '0';
        btn.dataset.wait = G.myTurn ? '0' : '1';
        if (!G.myTurn) {
          btn.disabled = true;
          btn.textContent = G.skipMe ? 'Sitting out — quokka fine' : 'Their shot';
        } else if (!aim) {
          btn.disabled = true;
          btn.textContent = mode === 'sonar' ? 'Pick where to listen' : 'Pick a square';
        } else if (mode === 'fire' && G.theirs.shots[aim.y * SIZE + aim.x] !== '.') {
          btn.disabled = true;
          btn.textContent = `Already fired at ${coord(aim.x, aim.y)}`;
        } else {
          btn.disabled = pending;
          btn.textContent = mode === 'sonar' ? `Ping around ${coord(aim.x, aim.y)}` : `Fire at ${coord(aim.x, aim.y)}`;
        }
      }
      if (G.theirs && !placing) {
        const theirMeta = G.phase === 'over' ? 'revealed' : `<b>${G.theirs.afloat.length}</b> afloat`;
        const myMeta = `<b>${G.mine.ships.filter((s) => !s.sunk).length}</b> afloat`;
        $('main-meta').innerHTML = mainShows === 'theirs' ? theirMeta : myMeta;
        $('mini-meta').innerHTML = mainShows === 'theirs' ? myMeta : theirMeta;
      }
    }

    function renderFeed() {
      const lines = (G.feed || []).slice(-4).map(feedLine).filter(([t]) => t);
      $('feed').innerHTML = lines.map(([t, cls]) => `<p class="${cls}">${escapeHtml(t)}</p>`).join('');
    }

    function renderFleets() {
      const pips = (n) => `<span class="sh-pips">${'<i></i>'.repeat(n)}</span>`;
      const showFleets = (G.phase === 'battle' || G.phase === 'over') && !G.spectator;
      $('fleet-mine').parentElement.hidden = !showFleets;
      if (!showFleets) return;
      const mine = G.mine?.ships || [];
      $('fleet-mine').innerHTML = FLEET.map((f) => {
        const s = mine.find((x) => x.id === f.id);
        return `<li data-sunk="${s?.sunk ? 1 : 0}">${pips(f.len)}${escapeHtml(f.name)}</li>`;
      }).join('');
      const afloat = new Set(G.theirs?.afloat || []);
      $('fleet-theirs').innerHTML = FLEET.map((f) => `<li data-sunk="${afloat.has(f.id) ? 0 : 1}">${pips(f.len)}${escapeHtml(f.name)}</li>`).join('');
      $('fleet-theirs-h').textContent = G.mode === 'solo' ? "CPU's fleet" : `${nameOf(themSeat())}'s fleet`;
    }

    // ── Overlays ───────────────────────────────────────────────────────────
    let overlayKey = '';
    function renderOverlay() {
      let key = '';
      if (G.spectator) key = `spec:${G.phase}:${isHost}`;
      else if (G.phase === 'lobby') key = `lobby:${players.map((p) => `${p.name}${p.online}`).join(',')}:${isHost}`;
      else if (G.phase === 'over' && !overPeek) key = `over:${G.game}:${isHost}:${players.length}:${players.map((p) => p.online).join()}`;
      if (key.startsWith('over:') && performance.now() < holdUntil) {
        // let the final boom play on the board before the results cover it
        overEl.hidden = true;
        overlayKey = '';
        clearTimeout(renderOverlay.timer);
        renderOverlay.timer = setTimeout(renderOverlay, holdUntil - performance.now() + 30);
        return;
      }
      if (!key) { overEl.hidden = true; overlayKey = ''; return; }
      overEl.hidden = false;
      if (key === overlayKey) return; // don't rebuild (and lose button focus) on every broadcast
      // Same overlay rebuilt (someone went on/offline): keep the scroll. A new
      // overlay (lobby → results, a new game) starts at the top.
      const kind = key.split(':').slice(0, 2).join(':');
      const keepScroll = overlayKey.split(':').slice(0, 2).join(':') === kind;
      const scroll = overEl.scrollTop;
      overlayKey = key;
      requestAnimationFrame(() => { overEl.scrollTop = keepScroll ? scroll : 0; });
      if (G.spectator) return showSpectator();
      if (G.phase === 'lobby') return showLobby();
      return showOver();
    }

    function showLobby() {
      const two = players.filter((p) => p.online).length >= 2;
      overInner.innerHTML = `
        <img class="sh-art" src="/arcade/rotto-sub-hunt/art/cabinet.png" alt="" />
        <h2>Rotto Sub Hunt</h2>
        <p class="ar-code-display">${escapeHtml(room.code() || '')}</p>
        <div class="ar-players">${players
          .map((p) => `<span class="ar-player"><span class="ar-dot" data-on="${p.online ? 1 : 0}"></span>${escapeHtml(p.name)}</span>`)
          .join('')}</div>
        <p>${two ? 'Both of you are here.' : 'Read the code out, or send the link — or just play the CPU.'}</p>
        ${isHost
          ? `<button class="ar-btn" id="go">${two ? 'Start the hunt' : 'Start vs the CPU'}</button>`
          : '<p>Waiting for them to start…</p>'}
        ${two ? '' : '<button class="ar-btn ar-btn--ghost" id="lobby-share">Send the link</button>'}
        <ul class="sh-rules" style="margin-top:18px">
          <li>Hide four boats on your 8×8 patch of water: a <b>sub</b> (4), the <b>Rotto ferry</b> (3), a <b>patrol boat</b> (3) and a <b>tinny</b> (2).</li>
          <li>Take turns firing at their waters. Sink all four to win.</li>
          <li><b>Sonar</b>, twice a game: instead of firing, listen to a 3×3. It tells you how many boat sections are in there (and how many quokkas), but not where.</li>
          <li><img class="sh-quokka-inline" src="/arcade/rotto-sub-hunt/art/quokka.png" alt="" /> <b>Quokkas</b> paddle around both sides and move after every shot. Hit one and the ranger fines you a turn.</li>
          <li>30 seconds a shot. Sit on it and it's gone.</li>
        </ul>
      `;
      $('go')?.addEventListener('click', () => room.send({ t: 'start' }));
      $('lobby-share')?.addEventListener('click', async () => {
        const btn = $('lobby-share');
        const r = await shareRoom(SLUG, room.code(), 'Rotto Sub Hunt');
        if (r === 'copied') btn.textContent = 'Link copied — paste it to them';
        else if (r === 'failed') btn.textContent = `Code: ${room.code()}`;
      });
    }

    function showOver() {
      const won = G.winner === mySeat;
      const me = G.stats[mySeat], them = G.stats[themSeat()];
      const themName = G.mode === 'solo' ? 'CPU' : nameOf(themSeat());
      const acc = (s) => (s.shots ? `${Math.round((100 * s.hits) / s.shots)}%` : '—');
      const line = G.conceded
        ? (won ? `${escapeHtml(themName)} ran up the white flag.` : 'You ran up the white flag. No shame. Some shame.')
        : won
          ? `You found all four of their boats in <b>${me.shots}</b> shots.`
          : `${escapeHtml(themName)} found all four of yours in <b>${them.shots}</b> shots.`;
      const twoOnline = players.filter((p) => p.online).length >= 2;
      overInner.innerHTML = `
        <img class="sh-art" src="/arcade/rotto-sub-hunt/art/cabinet.png" alt="" />
        <p class="sh-big" data-tone="${won ? 'win' : 'lose'}">${won ? 'VICTORY' : 'SUNK'}</p>
        <p style="text-align:center">${line}</p>
        <table class="sh-stats">
          <tr><th></th><th>You</th><th>${escapeHtml(themName)}</th></tr>
          <tr><td>Shots</td><td>${me.shots}</td><td>${them.shots}</td></tr>
          <tr><td>Hits</td><td>${me.hits}</td><td>${them.hits}</td></tr>
          <tr><td>Accuracy</td><td>${acc(me)}</td><td>${acc(them)}</td></tr>
          <tr><td>Sonar used</td><td>${me.sonar}</td><td>${them.sonar}</td></tr>
          <tr><td>Quokkas bonked</td><td>${me.quokkas}</td><td>${them.quokkas}</td></tr>
          <tr><td>Series</td><td><b>${G.wins[mySeat] ?? 0}</b></td><td><b>${G.wins[themSeat()] ?? 0}</b></td></tr>
        </table>
        ${isHost || (G.mode === 'solo' && G.bot !== mySeat)
          ? `<button class="ar-btn" id="go">${twoOnline ? 'Rematch' : G.mode === 'solo' ? 'Again vs the CPU' : 'Play the CPU'}</button>`
          : '<p style="text-align:center">Waiting for them to call a rematch…</p>'}
        <button class="ar-btn ar-btn--ghost" id="peek">Look at the boards</button>
        <button class="ar-btn ar-btn--ghost" id="leave">Back to the arcade</button>
      `;
      $('go')?.addEventListener('click', () => room.send({ t: 'rematch' }));
      $('peek').addEventListener('click', () => { overPeek = true; render(); });
      $('leave').addEventListener('click', () => { location.href = '/arcade/'; });
    }

    // After peeking at the boards, a button in the status area brings results back.
    $('s-sub').addEventListener('click', (e) => {
      if (e.target.id !== 'peek-back') return;
      overPeek = false;
      overlayKey = '';
      render();
    });

    function showSpectator() {
      const done = G.phase === 'over';
      overInner.innerHTML = `
        <img class="sh-art" src="/arcade/rotto-sub-hunt/art/cabinet.png" alt="" />
        <h2>${done ? 'Their CPU game just ended' : 'Game in progress'}</h2>
        <p>${done
          ? 'Your mate just finished a game against the CPU skipper. Start the next one and it becomes a two-player game.'
          : 'Your mate is already playing the CPU skipper in this room. Hang tight — when that game ends, the next one is the two of you.'}</p>
        ${done && isHost ? '<button class="ar-btn" id="go">Start a two-player game</button>' : ''}
        <button class="ar-btn ar-btn--ghost" id="leave">Back to the arcade</button>
      `;
      $('go')?.addEventListener('click', () => room.send({ t: 'rematch' }));
      $('leave').addEventListener('click', () => { location.href = '/arcade/'; });
    }

    window.addEventListener('resize', () => { if (G) render(); });

    // Debug/automation hook, same spirit as window.__sl. Safe to expose: the
    // server owns turns, fleets, shots, quokkas and sonar, and never sends an
    // unsunk enemy boat or an enemy quokka to this page in the first place.
    window.__sh = {
      room,
      state: () => G,
      players: () => players,
      localFleet: () => fleet.map((s) => ({ ...s })),
      selected: () => selId,
      aim: () => aim,
    };
  </script>
</body>
</html>
