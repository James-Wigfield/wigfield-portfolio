<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Summit Fever — Wigfield Arcade</title>
  <meta name="description" content="Three or four friends race and rescue each other up a five-stage mountain through rain, lightning, fog, gales and blizzards. Carry a cookie. A multiplayer pixel-art climbing game." />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/arcade/shared/arcade.css" />
  <style>
    :root {
      --sf-warm: #ffb648;
      --sf-cold: #7fd3ff;
      --sf-ice: #bfefff;
      --sf-snow: #eef4fb;
    }
    html, body { height: 100%; }
    body { background: #0b1020; }
    #game[hidden] { display: none; }

    .sf {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 560px;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    .sf-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ar-faint);
      border-bottom: 1px solid var(--ar-line-soft);
      background: #0b1020;
    }
    .sf-head a { color: var(--ar-faint); text-decoration: none; }
    .sf-head .sf-spacer { flex: 1; }
    .sf-hbtn {
      appearance: none;
      background: none;
      border: 0;
      padding: 4px 2px;
      color: var(--ar-dim);
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }
    .sf-code {
      font-family: var(--ar-display);
      font-size: 10px;
      color: var(--ar-amber);
    }

    /* ── Stage (canvas + HUD) ──────────────────────────────────────────────── */
    .sf-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    #view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .sf-hud {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      padding: 8px 8px 12px;
      background: linear-gradient(180deg, rgba(6, 9, 20, 0.74) 0%, rgba(6, 9, 20, 0.5) 72%, rgba(6, 9, 20, 0) 100%);
      pointer-events: none;
      font-family: var(--ar-display);
      font-size: 8px;
      line-height: 1.5;
      color: #fff;
      text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, 0.7);
    }
    .sf-hud[hidden] { display: none; }
    .sf-row { display: flex; align-items: center; gap: 8px; }
    .sf-row + .sf-row { margin-top: 6px; }

    .sf-meter { flex: 1; min-width: 0; }
    .sf-meter__top { display: flex; justify-content: space-between; margin-bottom: 3px; font-size: 7px; }
    .sf-meter__bar {
      height: 7px;
      background: rgba(5, 8, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.35);
      overflow: hidden;
    }
    .sf-meter__fill { height: 100%; width: 100%; background: var(--sf-warm); transition: width 0.25s linear, background 0.4s; }
    .sf-meter--wet .sf-meter__fill { background: #4aa8ff; }
    .sf-meter--wet { flex: 0 0 64px; }
    .sf-meter[data-low="1"] .sf-meter__fill { animation: sf-blink 0.6s steps(2) infinite; }
    @keyframes sf-blink { 50% { opacity: 0.35; } }

    .sf-clock { flex: 0 0 auto; text-align: right; min-width: 48px; }
    .sf-clock b { font-size: 11px; font-weight: 400; }
    .sf-clock[data-urgent="1"] b { color: #ff7a6b; }

    .sf-pack { display: flex; gap: 6px; align-items: center; min-height: 24px; }
    .sf-ico {
      width: 24px;
      height: 24px;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      position: relative;
      flex: 0 0 auto;
    }
    .sf-ico i {
      position: absolute;
      right: -3px;
      bottom: -3px;
      font-style: normal;
      font-size: 7px;
      color: #fff;
    }
    .sf-ico[data-buff="1"]::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      height: 2px;
      width: var(--left, 100%);
      background: var(--sf-cold);
    }

    .sf-wx { display: flex; align-items: center; gap: 6px; margin-left: auto; text-align: right; }
    .sf-dot { display: inline-block; width: 7px; height: 7px; background: #fff; flex: 0 0 auto; }
    .sf-wx small { display: block; color: rgba(255, 255, 255, 0.72); font-size: 7px; }

    .sf-state { color: var(--sf-cold); }

    /* Party strip, under the meters */
    .sf-party {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      font-size: 7px;
      line-height: 1.3;
    }
    .sf-hud[data-summit="1"] { opacity: 0; transition: opacity 0.6s; }
    .sf-party[hidden] { display: none; }
    .sf-mate { flex: 1 1 0; min-width: 0; padding-top: 4px; border-top: 1px solid rgba(255, 255, 255, 0.22); }
    .sf-mate__name { display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; }
    .sf-mate__name span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .sf-mate__name .sf-dot { width: 6px; height: 6px; }
    .sf-mate__meta { display: none; }
    .sf-mate__bar { height: 3px; margin-top: 3px; background: rgba(0, 0, 0, 0.55); }
    .sf-mate__bar b { display: block; height: 100%; background: var(--sf-warm); }
    .sf-mate__tag { color: var(--sf-cold); }
    .sf-mate[data-off="1"] { opacity: 0.45; }

    /* Toasts and banners */
    .sf-toasts {
      position: absolute;
      left: 22px;
      right: 8px;
      bottom: 44px;
      display: flex;
      flex-direction: column-reverse;
      pointer-events: none;
      font-family: var(--ar-mono);
      font-size: 11px;
      line-height: 1.45;
      color: #fff;
      text-shadow: 0 1px 0 #000, 0 0 5px #000;
    }
    .sf-toast { margin-top: 4px; transition: opacity 0.6s; display: flex; gap: 6px; align-items: baseline; }
    .sf-toast .sf-dot { width: 6px; height: 6px; transform: translateY(-1px); }
    .sf-toast[data-fade="1"] { opacity: 0; }

    .sf-banner {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 26%;
      transform: translateY(-50%);
      text-align: center;
      pointer-events: none;
      font-family: var(--ar-display);
      color: #fff;
      text-shadow: 0 2px 0 #000, 0 0 14px rgba(0, 0, 0, 0.85);
      transition: opacity 0.5s;
    }
    .sf-banner[data-show="0"] { opacity: 0; }
    .sf-banner h2 { margin: 0; font-size: clamp(14px, 5.4vw, 22px); line-height: 1.5; font-weight: 400; }
    .sf-banner p { margin: 10px auto 0; max-width: 36ch; font-family: var(--ar-mono); font-size: 12px; line-height: 1.6; white-space: pre-line; }

    .sf-tip {
      position: absolute;
      left: 26px;
      right: 12px;
      bottom: 10px;
      pointer-events: none;
      font-family: var(--ar-mono);
      font-size: 12px;
      line-height: 1.5;
      color: #fff;
      text-shadow: 0 1px 0 #000, 0 0 6px #000;
      display: flex;
      gap: 8px;
      align-items: baseline;
      transition: opacity 0.5s;
    }
    .sf-tip b { font-family: var(--ar-display); font-size: 8px; font-weight: 400; color: var(--ar-amber); white-space: nowrap; }
    .sf-tip[data-show="0"] { opacity: 0; }
    .sf-frozen {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 14px;
      padding: 12px 10px 14px;
      text-align: center;
      pointer-events: none;
      font-family: var(--ar-display);
      font-size: 9px;
      line-height: 1.9;
      color: var(--sf-ice);
      background: rgba(6, 9, 20, 0.82);
      border-top: 1px solid var(--sf-ice);
      text-shadow: 0 2px 0 #000;
    }
    .sf-frozen[hidden] { display: none; }
    .sf-frozen #frozen-sub { color: var(--ar-amber); }
    .sf-frozen__bar { width: min(240px, 80%); height: 10px; margin: 8px auto 0; border: 1px solid var(--sf-ice); }
    .sf-frozen__bar b { display: block; height: 100%; background: var(--sf-ice); width: 0; }

    /* Overlays: lobby, camp, ending */
    .sf-over {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 18px 16px 24px;
      background: rgba(6, 9, 20, 0.82);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      touch-action: pan-y;
    }
    .sf-over[hidden] { display: none; }
    .sf-over[data-soft="1"] { background: linear-gradient(180deg, rgba(6, 9, 20, 0.88) 0%, rgba(6, 9, 20, 0.7) 70%, rgba(6, 9, 20, 0.15) 100%); }
    .sf-over h1, .sf-over h2 {
      font-family: var(--ar-display);
      font-weight: 400;
      line-height: 1.5;
      margin: 0;
    }
    .sf-over h1 { font-size: clamp(16px, 5.6vw, 22px); }
    .sf-over h2 { font-size: 11px; margin-top: 22px; color: var(--ar-dim); }
    .sf-eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ar-faint); margin: 0 0 8px; }
    .sf-lede { color: var(--ar-dim); font-size: 12px; line-height: 1.7; margin: 10px 0 0; max-width: 48ch; }
    .sf-lede b { color: var(--ar-ink); font-weight: 600; }

    .sf-codebig {
      font-family: var(--ar-display);
      font-size: clamp(22px, 9vw, 32px);
      letter-spacing: 0.12em;
      color: var(--ar-amber);
      margin: 14px 0 4px;
    }
    .sf-list { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid var(--ar-line); }
    .sf-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--ar-line);
      font-size: 12px;
    }
    .sf-list li .sf-grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sf-list li small { color: var(--ar-faint); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
    .sf-list li .sf-pts { font-family: var(--ar-display); font-size: 9px; color: var(--ar-amber); }
    .sf-list li .sf-pts[data-neg="1"] { color: var(--ar-red); }
    .sf-swatch { width: 10px; height: 10px; flex: 0 0 auto; }

    .sf-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .sf-actions .ar-btn { flex: 1 1 auto; width: auto; }

    .sf-legend { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin-top: 12px; font-size: 11px; color: var(--ar-dim); line-height: 1.5; }
    .sf-legend span:nth-child(odd) { font-family: var(--ar-display); font-size: 8px; color: var(--ar-ink); padding-top: 2px; white-space: nowrap; }

    .sf-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 14px; margin-top: 12px; }
    .sf-item { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; color: var(--ar-dim); line-height: 1.45; }
    .sf-item b { display: block; color: var(--ar-ink); font-weight: 600; }

    .sf-forecast { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 11px; color: var(--ar-dim); }
    .sf-forecast span { display: inline-flex; align-items: center; gap: 6px; }

    .sf-bar { height: 3px; background: var(--ar-line); margin-top: 16px; overflow: hidden; }
    .sf-bar b { display: block; height: 100%; background: var(--ar-amber); width: 100%; }

    .sf-awards { display: grid; gap: 0; margin-top: 10px; border-top: 1px solid var(--ar-line); }
    .sf-award { padding: 10px 0; border-bottom: 1px solid var(--ar-line); }
    .sf-award b { font-family: var(--ar-display); font-size: 9px; font-weight: 400; color: var(--ar-amber); }
    .sf-award p { margin: 4px 0 0; font-size: 12px; color: var(--ar-dim); }
    .sf-award p em { font-style: normal; color: var(--ar-ink); }
    .sf-body { color: var(--ar-dim); font-size: 13px; line-height: 1.75; margin: 12px 0 0; max-width: 56ch; }

    /* ── Touch pad ─────────────────────────────────────────────────────────── */
    .sf-pad {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: #0b1020;
      border-top: 1px solid var(--ar-line-soft);
      touch-action: none;
    }
    .sf-pad__side { display: flex; gap: 10px; }
    .sf-key {
      appearance: none;
      width: 68px;
      height: 64px;
      border: 1px solid var(--ar-line);
      border-bottom-width: 4px;
      border-radius: var(--ar-radius);
      background: var(--ar-panel);
      color: var(--ar-ink);
      font-family: var(--ar-display);
      font-size: 11px;
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .sf-key[data-down="1"] { background: #1a2742; border-bottom-width: 1px; transform: translateY(3px); }
    .sf-key--jump { width: 84px; color: var(--ar-amber); }
    .sf-key--use { color: var(--sf-cold); }
    .sf-key:disabled { opacity: 0.35; }
    .sf[data-phase="lobby"] .sf-pad, .sf[data-phase="ending"] .sf-pad { display: none; }
    .sf-keys-hint { display: none; }

    @media (pointer: fine) and (hover: hover) {
      .sf-pad { display: none; }
      .sf-keys-hint {
        display: block;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ar-faint);
        border-top: 1px solid var(--ar-line-soft);
        text-align: center;
      }
      .sf-keys-hint b { color: var(--ar-dim); font-weight: 600; }
    }
  </style>
</head>
<body>
  <div id="gate"></div>

  <div id="game" hidden>
    <div class="sf">
      <header class="sf-head">
        <a href="/arcade/">← Arcade</a>
        <button class="sf-hbtn sf-code" id="code" title="Share this room">—</button>
        <span class="sf-spacer"></span>
        <span id="stage-label"></span>
        <button class="sf-hbtn" id="mute">Sound on</button>
      </header>

      <div class="sf-stage" id="stage">
        <canvas id="view"></canvas>

        <div class="sf-hud" id="hud" hidden>
          <div class="sf-row">
            <div class="sf-meter" id="warm-meter">
              <div class="sf-meter__top"><span>Warmth</span><span id="warm-num">100</span></div>
              <div class="sf-meter__bar"><div class="sf-meter__fill" id="warm-fill"></div></div>
            </div>
            <div class="sf-meter sf-meter--wet">
              <div class="sf-meter__top"><span>Wet</span><span id="wet-num">0</span></div>
              <div class="sf-meter__bar"><div class="sf-meter__fill" id="wet-fill"></div></div>
            </div>
            <div class="sf-clock" id="clock"><span id="clock-label">Stage</span><br /><b id="clock-num">0:00</b></div>
          </div>
          <div class="sf-row">
            <div class="sf-pack" id="pack"></div>
            <div class="sf-wx" id="wx"></div>
          </div>
          <div class="sf-party" id="party"></div>
          <div class="sf-row"><span class="sf-state" id="me-state"></span></div>
        </div>

        <div class="sf-toasts" id="toasts"></div>
        <div class="sf-banner" id="banner" data-show="0"><h2 id="banner-h"></h2><p id="banner-p"></p></div>
        <div class="sf-tip" id="tip" data-show="0"><b>TIP</b><span id="tip-text"></span></div>
        <div class="sf-frozen" id="frozen" hidden>
          FROZEN SOLID<br />Mash JUMP to shiver free<br /><span id="frozen-sub">A friend standing next to you thaws you fast</span>
          <div class="sf-frozen__bar"><b id="frozen-fill"></b></div>
        </div>
        <div class="sf-over" id="over" hidden></div>
      </div>

      <div class="sf-pad" id="pad">
        <div class="sf-pad__side">
          <button class="sf-key" data-k="left" aria-label="Left">&lt;</button>
          <button class="sf-key" data-k="right" aria-label="Right">&gt;</button>
        </div>
        <div class="sf-pad__side">
          <button class="sf-key sf-key--use" data-k="use">USE</button>
          <button class="sf-key sf-key--jump" data-k="jump">JUMP</button>
        </div>
      </div>
      <div class="sf-keys-hint"><b>← →</b> move · <b>Space / ↑</b> jump (hold to climb ropes) · <b>E</b> use · <b>M</b> mute</div>
    </div>
  </div>

  <script type="module">
    import { mountArcade, shareRoom, escapeHtml } from '/arcade/shared/room.js';
    import {
      buildWorld, stepBody, makeBody, makeBot, stepBot, windAt, inBivvy, byFire, tileAt,
      STAGES, WEATHER, ITEMS, ITEM_KINDS, TILE, COLS, WORLD_W, PHYS,
      ROCK, LEDGE, ICE, ROPE, GROUND, mulberry32,
    } from '/arcade/summit-fever/world.js';

    const SLUG = 'summit-fever';
    const ART = '/arcade/summit-fever/art/';
    const VW = WORLD_W; // 320 world pixels across, always

    // Jacket hues per climber colour. Red is the source sprite.
    const COLOURS = {
      red: { css: '#ef4b3f', hue: null },
      blue: { css: '#4a90f0', hue: 214 },
      yellow: { css: '#f2c53d', hue: 47, lift: 0.14 },
      green: { css: '#4cc26a', hue: 128 },
      purple: { css: '#b07cf5', hue: 280 },
      orange: { css: '#f58a3c', hue: 25, lift: 0.04 },
    };

    const WX_DOT = {
      clear: '#ffd25a', drizzle: '#8fc8ff', downpour: '#4a8fe6', thunder: '#c9a2ff',
      fog: '#b9c2cc', gale: '#9fe3d0', snow: '#e8f2ff', blizzard: '#ffffff', whiteout: '#f4f7fa',
    };
    const WX_TIP = {
      clear: 'Sun is out. Warm up and dry off while it lasts.',
      drizzle: 'Light rain. Wet clothes make the cold bite harder.',
      downpour: 'Soaked to the skin. Keep moving or find a bivvy tent.',
      thunder: 'Lightning lands where it crackles. Do NOT hold an umbrella.',
      fog: 'You cannot see a thing. Stay close to each other.',
      gale: 'Gusts will shove you off ledges. Time your jumps.',
      snow: 'Snow now. Anyone still wet is going to freeze fast.',
      blizzard: 'Blizzard. Huddle together or freeze solid.',
      whiteout: 'Whiteout. Follow the jacket in front of you.',
    };
    const GEM_LABEL = { berry: 'berries', crystal: 'a crystal', flower: 'an edelweiss' };

    // ── DOM ───────────────────────────────────────────────────────────────
    const $ = (id) => document.getElementById(id);
    const gateEl = $('gate');
    const gameEl = $('game');
    const stageEl = $('stage');
    const canvas = $('view');
    const dctx = canvas.getContext('2d');
    const overEl = $('over');

    // World buffer: everything pixel-art is drawn here at 1 world px = 1 px,
    // then scaled up once. Text is drawn afterwards at device resolution.
    const wc = document.createElement('canvas');
    const w = wc.getContext('2d');
    const up = document.createElement('canvas');
    const upx = up.getContext('2d');
    let VH = 480;
    let dpr = 1;
    let scale = 1; // device px per world px

    function resize() {
      const r = stageEl.getBoundingClientRect();
      dpr = Math.min(3, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(r.width * dpr));
      canvas.height = Math.max(1, Math.round(r.height * dpr));
      scale = canvas.width / VW;
      VH = Math.max(240, Math.round(canvas.height / scale));
      wc.width = VW;
      wc.height = VH;
      w.imageSmoothingEnabled = false;
    }
    new ResizeObserver(resize).observe(stageEl);

    // ── Art ───────────────────────────────────────────────────────────────
    const art = { ok: {} };
    function loadImg(name) {
      return new Promise((res) => {
        const img = new Image();
        img.onload = () => { art.ok[name] = true; res(img); };
        img.onerror = () => res(null);
        img.src = ART + name;
      });
    }
    async function loadJson(name) {
      try {
        const r = await fetch(ART + name);
        return r.ok ? await r.json() : null;
      } catch { return null; }
    }
    const artReady = (async () => {
      const [hiker, hikerJ, items16, items32, itemsJ, tiles, tilesJ, hut, fire, chopper, ...bgs] = await Promise.all([
        loadImg('hiker.png'), loadJson('hiker.json'), loadImg('items16.png'), loadImg('items32.png'), loadJson('items.json'),
        loadImg('tiles.png'), loadJson('tiles.json'), loadImg('hut.png'), loadImg('fire.png'), loadImg('chopper.png'),
        loadImg('bg-forest.png'), loadImg('bg-alpine.png'), loadImg('bg-glacier.png'), loadImg('bg-summit.png'),
      ]);
      Object.assign(art, { hiker, hikerJ, items16, items32, itemsJ, tiles, tilesJ, hut, fire, chopper });
      art.bg = { forest: bgs[0], alpine: bgs[1], glacier: bgs[2], summit: bgs[3] };
      art.skyTop = {};
      for (const [k, img] of Object.entries(art.bg)) if (img) art.skyTop[k] = sampleTop(img);
      if (hiker && hikerJ) art.hikers = buildHikerSheets(hiker, hikerJ);
      if (itemsJ?.order) art.itemIndex = Object.fromEntries(itemsJ.order.map((k, i) => [k, i]));
      else art.itemIndex = Object.fromEntries(ITEM_KINDS.map((k, i) => [k, i]));
      if (tilesJ) {
        art.tileTheme = Object.fromEntries(tilesJ.themes.map((k, i) => [k, i]));
